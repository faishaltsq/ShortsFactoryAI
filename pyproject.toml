[project]
name = "shorts-factory"
version = "0.1.0"
description = "Autonomous local YouTube Shorts production system"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "edge-tts==7.3.1",
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.5",
    "apscheduler==3.11.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff", "httpx2==2.15.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
